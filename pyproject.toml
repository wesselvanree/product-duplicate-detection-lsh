[project]
name = "pdd"
version = "0.1.0"
description = "Scalable Product Duplicate Detection using LSH"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.10.9,<3.11",
    "numpy>=1.26.4,<2",
    "pandas>=2.3.3,<3",
    "scikit-learn>=1.9.0,<2",
    "scipy>=1.17.1,<2",
    "tqdm>=4.68.2,<5",
]

[project.scripts]
example = "pdd:main"

[build-system]
requires = ["uv_build>=0.9.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
constraint-dependencies = [
    "packaging<26",
    "pillow<13",
    "python-dateutil<3",
]
