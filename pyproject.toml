[project]
name = "pdd"
version = "0.1.0"
description = "Scalable Product Duplicate Detection using LSH"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "tqdm==4.70.1",
]

[project.scripts]
example = "pdd:main"

[build-system]
requires = ["uv_build>=0.9.14,<0.12.0"]
build-backend = "uv_build"
